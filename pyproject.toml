[project]
name = "respiratory-sound-analysis"
version = "0.0.1"
description = "Acoustic detection and classification of respiratory cycle anomalies (wheezes & crackles) using Deep Learning. B.Sc. Thesis Project @ WUT."
readme = "README.md"
authors = [
    { name = "gwiazdan", email = "norbert.gwiazda@icloud.com" },
    { name = "MCiurzynski"}
]
requires-python = ">=3.12"
dependencies=[
    "librosa>=1.0.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "pyfonts>=1.4.1",
    "pypalettes>=0.2.1",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.70.0",
    "ultralytics>=8.4.136",
]

[tool.uv]
package=true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "ipython>=9.17.0",
    "jupyter>=1.1.1",
    "jupytext>=1.19.5",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "ipykernel>=7.3.0",
    "rust-just>=1.58.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes (detects unused imports, variables, undefined names)
    "I",      # isort (strict import sorting and formatting)
    "B",      # flake8-bugbear (common design flaws and bugs)
    "UP",     # pyupgrade (enforces Python 3.12+ modern syntax conventions)
    "N",      # pep8-naming (strict naming conventions for classes/functions)
    "SIM",    # flake8-simplify (refactors complex loops and conditional branches)
    "C4",     # flake8-comprehensions (optimizes generator and collection expressions)
    "A",      # flake8-builtins (prevents shadowing of Python built-in names)
    "RUF",    # Ruff-specific rules (advanced static analysis checks)
    "S",      # flake8-bandit (security checks for vulnerable code patterns)
    "PERF",   # Perflint (identifies performance bottlenecks in iteration loops)
    "FURB",   # Refurb (modernizes legacy Python idioms to cutting-edge standards)
    "PT",     # flake8-pytest-style (enforces best practices in test suites)
    "LOG",    # flake8-logging (validates proper logging calls and formatting)
    "SLF",    # flake8-self (warns against private member access outside classes)
]

ignore = [
    "E501",   # Line length warnings (delegated entirely to the Ruff formatter)
    "S311",   # Standard pseudo-random generator warnings (permitted for ML random seeds)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",   # Allow raw `assert` statements in test suites
    "SLF001", # Allow accessing private members during unit testing
]

"notebooks/*" = [
    "F401",   # Ignore unused imports during interactive exploration
    "F841",   # Ignore unused local variables in draft cells
    "T201",   # Allow `print()` statements for quick inspection
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "librosa.*",
    "scipy.*",
    "torchaudio.*",
    "matplotlib.*",
    "seaborn.*",
]
ignore_missing_imports = true
